  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --primary:#6d1b2f;--accent:#b8860b;--success:#2e7d32;
      --danger:#c62828;--warn:#a8710a;--gas:#e65100;--oil:#558b2f;
      --bg:#f7f4ef;--card:#fff;--text:#241417;--text2:#5c5254;
      --border:#e6ddd6;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.1);
    }
    html{height:100%}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
    #app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative}
    /* HEADER */
    .app-header{background:var(--primary);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 8px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.3)}
    .app-logo{width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.55);flex-shrink:0;box-shadow:0 1px 4px rgba(0,0,0,.35)}
    .header-top{display:flex;align-items:center;justify-content:space-between}
    .header-title{font-size:14px;font-weight:700;line-height:1.2}
    .header-sub{font-size:10px;opacity:.8;margin-top:1px}
    .back-btn{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;padding:0 8px 0 0}
    .sync-btn{background:rgba(255,255,255,.2);border:none;color:#fff;font-size:16px;cursor:pointer;padding:6px 8px;border-radius:8px;margin-left:6px}
    /* MONTH SELECTOR */
    .month-bar{display:flex;align-items:center;justify-content:center;gap:8px;padding:6px 0 2px}
    .month-nav-btn{background:rgba(255,255,255,.2);border:none;color:#fff;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
    .month-nav-btn:disabled{opacity:.3;cursor:default}
    .month-label{font-size:14px;font-weight:700;color:#fff;min-width:140px;text-align:center}
    /* VACANCY STRIP */
    .vacancy-strip{background:rgba(255,255,255,.1);padding:4px 14px;font-size:10px;color:rgba(255,255,255,.9);display:flex;gap:12px;flex-wrap:wrap}
    /* STATS BAR */
    .stats-bar{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:8px 10px 4px}
    .stat-card{background:var(--card);border-radius:10px;padding:6px 2px;text-align:center;box-shadow:var(--shadow)}
    .stat-card .val{font-size:12px;font-weight:800;color:var(--primary)}
    .stat-card .lbl{font-size:9px;color:var(--text2);margin-top:1px;line-height:1.2}
    .stat-card.green .val{color:var(--success)}.stat-card.red .val{color:var(--danger)}.stat-card.orange .val{color:var(--accent)}
    /* BOTTOM NAV */
    .bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--card);border-top:1px solid var(--border);display:flex;z-index:200;box-shadow:0 -2px 10px rgba(0,0,0,.1);padding-bottom:env(safe-area-inset-bottom)}
    .nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;padding:7px 4px 5px;border:none;background:none;cursor:pointer;color:var(--text2);font-size:10px;gap:3px;position:relative}
    .nav-btn.active{color:var(--primary)}
    .nav-btn svg{width:22px;height:22px}
    /* SCREEN */
    .screen{padding:6px 10px calc(80px + env(safe-area-inset-bottom))}
    .sec-title{font-size:13px;font-weight:700;color:var(--primary);margin:10px 0 6px;display:flex;align-items:center;gap:6px}
    /* FLOOR TABS */
    .floor-tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
    .floor-tabs::-webkit-scrollbar{display:none}
    .floor-tab{border:none;border-radius:20px;padding:5px 14px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;background:var(--card);color:var(--text2);box-shadow:var(--shadow)}
    .floor-tab.active{background:var(--primary);color:#fff}
    /* ROOM GRID */
    .room-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
    .room-card{background:var(--card);border-radius:10px;padding:10px;box-shadow:var(--shadow);cursor:pointer;border:2px solid transparent;transition:all .15s}
    .room-card:active{transform:scale(.97)}
    .room-card.full{border-color:var(--danger);background:#fff5f5}
    .room-card.partial{border-color:var(--warn);background:#fffde7}
    .room-card.empty{border-color:#b2dfdb;background:#e0f7fa}
    .room-card .rnum{font-size:20px;font-weight:800;color:var(--primary)}
    .room-card .rcap{font-size:10px;color:var(--text2);margin-top:1px}
    .share-grid{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}
    .share-slot{min-width:22px;height:22px;border-radius:5px;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 3px;flex-shrink:0}
    .share-slot.occupied{background:var(--primary);color:#fff}
    .share-slot.vacated{background:#ff8a65;color:#fff}
    .share-slot.vacant{background:var(--border);color:#999;border:1px dashed #aaa}
    /* CARD */
    .card{background:var(--card);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);margin-bottom:10px}
    /* TENANT ROW */
    .tenant-share-row{padding:8px 0;border-bottom:1px solid var(--border)}
    .tenant-share-row:last-child{border-bottom:none}
    .share-header{display:flex;align-items:center;gap:6px}
    .share-badge{background:var(--primary);color:#fff;border-radius:6px;padding:2px 7px;font-size:11px;font-weight:800;flex-shrink:0}
    .share-badge.vacated-b{background:#e64a19}
    .share-badge.vacant-b{background:var(--border);color:#888}
    .t-name{font-size:14px;font-weight:600}
    .t-meta{font-size:11px;color:var(--text2);margin-top:2px}
    .t-badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
    .badge{display:inline-block;border-radius:12px;padding:2px 8px;font-size:10px;font-weight:700}
    .badge.green{background:#e8f5e9;color:var(--success)}.badge.red{background:#ffebee;color:var(--danger)}
    .badge.orange{background:#fff3e0;color:var(--accent)}.badge.gray{background:#f5f5f5;color:#666}
    .badge.blue{background:#e3f2fd;color:#1565c0}.badge.vacated{background:#fbe9e7;color:#bf360c}
    /* VACANT ROW */
    .vacant-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)}
    .vacant-row:last-child{border-bottom:none}
    /* BTN */
    .btn{border:none;border-radius:10px;padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
    .btn:active{transform:scale(.97)}
    .btn-primary{background:var(--primary);color:#fff}.btn-accent{background:var(--accent);color:#fff}
    .btn-success{background:var(--success);color:#fff}.btn-danger{background:var(--danger);color:#fff}
    .btn-warn{background:var(--warn);color:#333}.btn-outline{background:transparent;color:var(--primary);border:2px solid var(--primary)}
    .btn-gray{background:#f5f5f5;color:#333;border:1px solid var(--border)}
    .btn-full{width:100%;justify-content:center}.btn-sm{padding:6px 12px;font-size:12px;border-radius:8px}.btn-xs{padding:4px 8px;font-size:11px;border-radius:6px}
    /* FAB */
    .fab{position:fixed;bottom:calc(72px + env(safe-area-inset-bottom));right:20px;width:52px;height:52px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:26px;cursor:pointer;box-shadow:0 4px 14px rgba(245,124,0,.5);display:flex;align-items:center;justify-content:center;z-index:150}
    .fab:active{transform:scale(.92)}
    /* MODAL */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;display:flex;align-items:flex-end;justify-content:center}
    .modal{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:430px;max-height:92vh;overflow-y:auto;padding:20px 16px calc(28px + env(safe-area-inset-bottom));animation:slideUp .3s ease}
    .modal-title{font-size:17px;font-weight:700;color:var(--primary);margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
    @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
    /* FORM */
    .form-group{margin-bottom:12px}
    .form-group label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:4px}
    .form-group input,.form-group select,.form-group textarea{width:100%;border:1.5px solid var(--border);border-radius:8px;padding:9px 12px;font-size:16px;background:var(--bg);color:var(--text);outline:none;transition:border-color .2s}
    .form-group textarea{min-height:65px;resize:vertical}
    .form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--primary);background:#fff}
    .form-group input.req{border-color:var(--accent)}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    /* EXPENSE */
    .exp-item{display:flex;justify-content:space-between;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border)}
    .exp-item:last-child{border-bottom:none}
    .exp-cat{font-size:13px;font-weight:600}.exp-date{font-size:11px;color:var(--text2);margin-top:2px}
    .exp-items-preview{font-size:11px;color:var(--primary);margin-top:2px;font-style:italic}
    .exp-meta{font-size:10px;color:var(--primary);font-weight:600;margin-top:2px}
    .exp-amt{font-size:15px;font-weight:700;color:var(--danger)}
    /* WATER */
    .water-item{display:flex;justify-content:space-between;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border)}
    .water-item:last-child{border-bottom:none}
    /* COMMODITY */
    .commodity-card{border-left:4px solid var(--gas)}.commodity-card.oil{border-left-color:var(--oil)}
    .commodity-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
    .comm-stat{background:var(--bg);border-radius:8px;padding:7px 5px;text-align:center}
    .comm-stat .cv{font-size:13px;font-weight:800}.comm-stat .cl{font-size:10px;color:var(--text2);margin-top:2px}
    .commodity-entry{padding:8px 0;border-bottom:1px solid var(--border)}
    .commodity-entry:last-child{border-bottom:none}
    .ce-title{font-size:13px;font-weight:700}.ce-meta{font-size:11px;color:var(--text2);margin-top:2px}
    .ce-progress{background:var(--border);border-radius:4px;height:5px;margin-top:6px;overflow:hidden}
    .ce-bar{height:100%;border-radius:4px;background:var(--success)}
    /* PAY HIST */
    .pay-hist{background:#f8f9ff;border-radius:8px;padding:10px;margin-top:8px}
    .pay-row{display:flex;flex-direction:column;gap:2px;padding-bottom:7px;border-bottom:1px solid var(--border);margin-bottom:4px}
    .pay-row:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
    /* SUM ROW */
    .sum-row{display:flex;justify-content:space-between;padding:6px 0;font-size:13px}
    .sum-row:not(:last-child){border-bottom:1px solid var(--border)}
    .sum-lbl{color:var(--text2)}.sum-val{font-weight:700}
    /* LEGEND */
    .legend{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
    .legend-item{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text2)}
    .legend-dot{width:10px;height:10px;border-radius:50%}
    /* CAT CHIPS */
    .cat-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
    .cat-chip{border:1.5px solid var(--border);border-radius:20px;padding:4px 12px;font-size:12px;background:var(--card);cursor:pointer}
    .cat-chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
    /* ROLLOVER CARD */
    .rollover-card{background:linear-gradient(135deg,#1a237e,#283593);color:#fff;border-radius:var(--radius);padding:16px;margin-bottom:10px;text-align:center}
    .rollover-card h3{font-size:16px;margin-bottom:6px}
    .rollover-card p{font-size:12px;opacity:.85;margin-bottom:14px}
    /* STATUS INDICATOR */
    .status-cont{background:#e8f5e9;color:var(--success);border-radius:20px;padding:3px 10px;font-size:11px;font-weight:700}
    .status-vac{background:#fbe9e7;color:#bf360c;border-radius:20px;padding:3px 10px;font-size:11px;font-weight:700}
    /* MISC */
    .icon-btn{background:none;border:none;cursor:pointer;padding:4px;border-radius:6px}
    .aadhar-preview{width:100%;border-radius:8px;max-height:160px;object-fit:cover;margin-top:8px;border:1px solid var(--border)}
    .aadhar-upload-btn{display:flex;align-items:center;gap:8px;background:var(--bg);border:2px dashed var(--border);border-radius:8px;padding:12px;cursor:pointer;width:100%;justify-content:center;color:var(--text2);font-size:13px;font-weight:600}
    .info-box{background:#e8f5e9;border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:12px;color:#1b5e20}
    .warn-box{background:#fff3e0;border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:12px;color:#e65100}
    .danger-box{background:#ffebee;border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:12px;color:var(--danger)}
    .comm-box{background:#fffde7;border-radius:8px;padding:10px 12px;margin-bottom:12px;border-left:3px solid var(--warn)}
    .person-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:5px}
    .person-stat{background:var(--bg);border-radius:8px;padding:7px 5px;text-align:center}
    .person-stat .pv{font-size:13px;font-weight:800}
    .person-stat .pl{font-size:9px;color:var(--text2);margin-top:2px}
    input[type=file]{display:none}
    .empty-state{text-align:center;padding:24px 20px;color:var(--text2)}
    .empty-state p{font-size:13px}
    .divider{border:none;border-top:1px solid var(--border);margin:10px 0}
    .toast{position:fixed;bottom:calc(80px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;z-index:500;animation:fadeInOut 2.6s forwards;white-space:nowrap;max-width:90%}
    @keyframes fadeInOut{0%{opacity:0;transform:translateX(-50%) translateY(10px)}15%{opacity:1;transform:translateX(-50%) translateY(0)}80%{opacity:1}100%{opacity:0}}
    @keyframes load{from{transform:translateX(0)}to{transform:translateX(100%)}}
  </style>
<script>
// Diagnostic error catcher — if the app script throws during startup, show the
// real error on screen instead of leaving a stuck loading spinner with no clue.
window.addEventListener('error', function(e){
  try{
    var box = document.getElementById('loading') || document.body;
    var msg = (e && e.message) || 'Unknown error';
    var where = ((e && e.filename) || '') + ':' + ((e && e.lineno) || '') + ':' + ((e && e.colno) || '');
    var stack = (e && e.error && e.error.stack) ? String(e.error.stack).slice(0,600) : '';
    box.innerHTML = '<div style="color:#fff;background:#c62828;padding:16px;font-family:monospace;font-size:12px;line-height:1.5;text-align:left;word-break:break-word;border-radius:8px;margin:16px">'
      + '<b>App failed to start</b><br><br>'
      + '<b>Message:</b> ' + msg + '<br><br>'
      + '<b>Location:</b> ' + where + '<br><br>'
      + '<b>Stack:</b><br>' + stack
      + '</div>';
    box.style.display = 'block';
  }catch(_e){}
});
</script>

const CLOUD_SYNC_ENABLED = FIREBASE_CONFIG.apiKey !== "REPLACE_ME";
const CLIENT_ID = Math.random().toString(36).slice(2) + Date.now().toString(36);
let fsDoc = null;
let lastSyncVersion = 0;

function initCloudSync() {
  if (!CLOUD_SYNC_ENABLED) return;
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    fsDoc = firebase.firestore().collection('pg').doc('main');
    fsDoc.get().then(snap => {
      if (snap.exists && snap.data() && snap.data().payload) {
        const remote = snap.data();
        db = remote.payload;
        lastSyncVersion = remote.version || 0;
        try { localStorage.setItem(DB_KEY, JSON.stringify(db)); } catch(e){}
        render();
      } else {
        pushToCloud();
      }
      listenForRemoteChanges();
    }).catch(err => { console.error('Cloud sync init failed:', err); showToast('⚠️ Cloud sync unavailable — working offline'); });
  } catch(err) { console.error('Firebase init error:', err); }
}

function pushToCloud() {
  if (!CLOUD_SYNC_ENABLED || !fsDoc) return;
  lastSyncVersion += 1;
  fsDoc.set({ payload: db, version: lastSyncVersion, updatedBy: CLIENT_ID, updatedAt: Date.now() })
    .catch(err => console.error('Cloud push failed:', err));
}

function listenForRemoteChanges() {
  if (!CLOUD_SYNC_ENABLED || !fsDoc) return;
  fsDoc.onSnapshot(snap => {
    if (!snap.exists) return;
    const remote = snap.data();
    if (!remote || remote.updatedBy === CLIENT_ID) return;
    if ((remote.version || 0) <= lastSyncVersion) return;
    lastSyncVersion = remote.version || 0;
    db = remote.payload;
    try { localStorage.setItem(DB_KEY, JSON.stringify(db)); } catch(e){}
    if (!showModal) { render(); showToast('🔄 Updated by partner'); }
  }, err => console.error('Cloud listener error:', err));
}

    const raw = localStorage.getItem(DB_KEY);
    if (raw) {
      const db = JSON.parse(raw);
      // Migrate v2 → v3
      if (db.rooms && !db.months) {
        db.months = {"2026-09":{rooms:db.rooms}};
        db.currentMonth = "2026-09";
        delete db.rooms;
        localStorage.setItem(DB_KEY, JSON.stringify(db));
      }
      if (!db.gasEntries)    db.gasEntries=[];
      if (!db.oilEntries)    db.oilEntries=[];
      if (!db.gasPricePerUnit) db.gasPricePerUnit=2800;

      if (!db.currentMonth) db.currentMonth="2026-09";

function el(tag,attrs,...children){
  const e=document.createElement(tag);
  if(attrs) Object.entries(attrs).forEach(([k,v])=>{
    if(k==='className') e.className=v;
    else if(k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==='style'&&typeof v==='object') Object.assign(e.style,v);
    else e.setAttribute(k,v);
  });
  children.flat().forEach(c=>{ if(c==null||c===false)return; e.appendChild(typeof c==='string'?document.createTextNode(c):c); });
  return e;
}

function rolloverToMonth(targetKey) {
  const src = prevMonthKey(targetKey);
  if (!src || !db.months[src]) { showToast('⚠️ No previous month data'); return; }
  const srcRooms = db.months[src].rooms;
  const newRooms = makeEmptyRooms();

  let carried=0;
  Object.keys(srcRooms).forEach(rno=>{
    const srcTenants=(srcRooms[rno]?.tenants||[]);
    srcTenants.forEach(t=>{
      if(t.status==='vacated'||t.status==='deleted') return;
      // carry over with fresh fee tracking
      const prevBalance=Math.max(0,(t.totalFee||0)-(t.paidFee||0));
      const carryTenant={
        ...t,
        id:uuid(),
        paidFee:0,
        balanceFee:t.totalFee||0,
        paymentDate:'',
        paymentHistory:[],
        status:'active',
        prevBalance, // outstanding from last month
        carriedFromMonth:src,
        carriedFromId:t.id
      };
      newRooms[rno].tenants.push(carryTenant);
      carried++;
    });
  });

  if(!db.months[targetKey]) db.months[targetKey]={rooms:newRooms,rentPayments:[]};
  else if(!db.months[targetKey].rentPayments) db.months[targetKey].rentPayments=[];
  db.currentMonth=targetKey;
  saveDB(db);
  showToast(`✅ ${carried} tenant${carried!==1?'s':''} rolled over to ${monthLabel(targetKey)}`);
  showModal=null; render();
}

    btnRow.appendChild(el('button',{className:'sync-btn',title:'Export data backup',onClick:()=>{ showModal='export_data'; render(); }},'📤'));
    btnRow.appendChild(el('button',{className:'sync-btn',title:'Import data backup',onClick:()=>{ showModal='import_data'; render(); }},'📥'));
    top.appendChild(btnRow);
  }
  hd.appendChild(top);

  // Month selector
  const ms=el('div',{className:'month-bar'});
  const prevBtn=el('button',{className:'month-nav-btn',onClick:()=>navigateMonth(-1)},'‹');
  const nextBtn=el('button',{className:'month-nav-btn',onClick:()=>navigateMonth(1)},'›');
  if(midx===0) prevBtn.disabled=true;
  if(midx===MONTHS_LIST.length-1) nextBtn.disabled=true;
  ms.appendChild(prevBtn);
  ms.appendChild(el('div',{className:'month-label'},monthLabel(mid)));
  ms.appendChild(nextBtn);
  hd.appendChild(ms);

  // Vacancy strip
  hd.appendChild(el('div',{className:'vacancy-strip'},
    el('span',{},'🛏️ Vacant: '+vac.vacantBeds+' beds'),
    el('span',{},'🚪 Rooms w/ vacancy: '+vac.vacantRooms)
  ));

  return hd;
}

function navigateMonth(dir){
  const idx=MONTHS_LIST.indexOf(db.currentMonth);
  const newIdx=idx+dir;
  if(newIdx<0||newIdx>=MONTHS_LIST.length) return;
  const targetKey=MONTHS_LIST[newIdx];
  db.currentMonth=targetKey;
  // If new month has no data, show rollover modal
  if(!db.months[targetKey]||!db.months[targetKey].rooms){
    showModal='rollover'; render(); return;
  }
  saveDB(db); render();
}

// ─── STATS BAR ───────────────────────────────────────
function renderStatsBar(){
  const occ=getTotalOccupied(),cap=getTotalCapacity(),col=getTotalCollected(),spent=getTotalSpent(),tans=getTotalTankers();

  return el('div',{className:'stats-bar'},
    sc('',`${occ}/${cap}`,'Beds'),
    sc(' green',col>=1000?`₹${(col/1000).toFixed(1)}k`:`₹${col}`,'Collected'),
    sc(' red',spent>=1000?`₹${(spent/1000).toFixed(1)}k`:`₹${spent}`,'Spent'),
    sc(bal>=0?' green':' red',Math.abs(bal)>=1000?`₹${(bal/1000).toFixed(1)}k`:`₹${bal}`,'Balance'),
    sc(' orange',`${tans}💧`,'Tankers')
  );
}

  });
  wrap.appendChild(tabs);

  const grid=el('div',{className:'room-grid'});
  FLOORS[floorTab].forEach(rno=>{
    const cap=roomCap(rno);
    const tenants=activeTenants(rno);
    const activeOcc=tenants.filter(t=>t.status!=='vacated').length;
    const vacatedOcc=tenants.filter(t=>t.status==='vacated').length;
    const cls=activeOcc===0?(vacatedOcc>0?'partial':'empty'):activeOcc>=cap?'full':'partial';

    // Share slots
    const sg=el('div',{className:'share-grid'});
    const occupiedMap={};
    tenants.forEach(t=>{ if(t.shareNo) occupiedMap[t.shareNo]=t; });
    for(let i=1;i<=cap;i++){
      const tenant=occupiedMap[i];
      if(tenant){
        const isVac=tenant.status==='vacated';
        const initials=tenant.name.split(' ').map(w=>w[0]||'').join('').substring(0,2).toUpperCase();
        sg.appendChild(el('div',{className:`share-slot ${isVac?'vacated':'occupied'}`,title:`S${i}: ${tenant.name}`},initials||String(i)));

      }

    card.appendChild(sg);
    grid.appendChild(card);
  });
  wrap.appendChild(grid);
  return wrap;
}

      el('div',{style:{fontSize:'10px',opacity:'.8'}},'Balance Due'))
  ));
  wrap.appendChild(hd);

  // Share-by-share view
  const lc=el('div',{className:'card',style:{padding:'8px 12px'}});
  lc.appendChild(el('div',{className:'sec-title'},`🛏️ Shares — ${monthLabel(db.currentMonth)}`));

  for(let i=1;i<=cap;i++){
    const tenant=occupiedMap[i];
    if(tenant){
      const isVacated=tenant.status==='vacated';
      const bal=(tenant.totalFee||0)-(tenant.paidFee||0);
      const row=el('div',{className:'tenant-share-row'});
      // Header
      const sh=el('div',{className:'share-header'});
      sh.appendChild(el('div',{className:`share-badge${isVacated?' vacated-b':''}`},`S${i}`));
      sh.appendChild(el('div',{style:{flex:'1'}},

          isVacated?el('span',{className:'status-vac'},'Vacated'):el('span',{className:'status-cont'},'Active ✓')
        ),
        el('div',{className:'t-meta'},`${tenant.mobile?'📱 '+tenant.mobile+' · ':''}Joined: ${formatDate(tenant.dateOfJoining)}`)
      ));
      sh.appendChild(el('button',{className:'btn btn-xs btn-outline',style:{flexShrink:'0'},onClick:()=>{currentTenant=tenant.id;showModal='tenant_detail';render();}},'View'));
      row.appendChild(sh);
      // Badges
      const bdg=el('div',{className:'t-badges',style:{marginTop:'5px',paddingLeft:'36px'}});
      bdg.appendChild(el('span',{className:'badge green'},`Paid: ${formatMoney(tenant.paidFee||0)}`));
      bal>0?bdg.appendChild(el('span',{className:'badge red'},`Due: ${formatMoney(bal)}`)):bdg.appendChild(el('span',{className:'badge green'},'✓ Cleared'));
      if(tenant.prevBalance>0) bdg.appendChild(el('span',{className:'badge orange'},`Prev: ${formatMoney(tenant.prevBalance)}`));
      row.appendChild(bdg);
      // Actions
      const acts=el('div',{style:{display:'flex',gap:'6px',marginTop:'6px',paddingLeft:'36px',flexWrap:'wrap'}});
      acts.appendChild(el('button',{className:'btn btn-xs btn-success',onClick:()=>{currentTenant=tenant.id;showModal='add_payment';render();}},'💳 Pay'));
      acts.appendChild(el('button',{className:'btn btn-xs btn-outline',onClick:()=>{currentTenant=tenant.id;showModal='edit_tenant';render();}},'✏️ Edit'));
      if(!isVacated){
        acts.appendChild(el('button',{className:'btn btn-xs btn-warn',onClick:()=>setTenantStatus(tenant.id,'vacated')},`🚪 Vacate`));
      } else {
        acts.appendChild(el('button',{className:'btn btn-xs btn-success',onClick:()=>setTenantStatus(tenant.id,'active')},'↩ Restore'));
      }
      acts.appendChild(el('button',{className:'btn btn-xs btn-danger',onClick:()=>{pendingDelete={type:'tenant',roomNo:rno,id:tenant.id};showModal='confirm_delete';render();}},'🗑'));

      row.appendChild(el('button',{className:'btn btn-xs btn-primary',onClick:()=>{currentTenant=null;_aadharBase64=null;showModal='add_tenant';render();}},`+ Add`));
      lc.appendChild(row);
    }
  }
  wrap.appendChild(lc);
  return wrap;
}

function setTenantStatus(tid,status){
  const room=monthRooms()[currentRoom];
  if(!room) return;
  const t=room.tenants.find(t=>t.id===tid);
  if(t){ t.status=status; if(status==='vacated') t.vacatedDate=today(); }
  saveDB(db);
  showToast(status==='vacated'?'🚪 Tenant marked as Vacated':'✅ Tenant restored as Active');
  render();
}

}

//  ROLLOVER MODAL
// ════════════════════════════════════════════════════════
function renderRolloverModal(){
  const targetKey=db.currentMonth;
  const srcKey=prevMonthKey(targetKey);
  const modal=el('div',{className:'modal'});
  modal.appendChild(el('div',{className:'modal-title'},`📅 ${monthLabel(targetKey)}`,el('button',{className:'icon-btn',style:{fontSize:'20px',color:'var(--text2)'},onClick:()=>{
    // go back to previous month
    if(srcKey){ db.currentMonth=srcKey; saveDB(db); }
    closeModal();
  }},'✕')));

  modal.appendChild(el('div',{className:'rollover-card'},
    el('h3',{},'New Month — No Data Yet'),
    el('p',{},`Roll over Active tenants from ${srcKey?monthLabel(srcKey):'previous month'} to ${monthLabel(targetKey)}?`)
  ));

  if(srcKey&&db.months[srcKey]){
    const srcRooms=db.months[srcKey].rooms||{};
    let continueCount=0,vacateCount=0;
    Object.values(srcRooms).forEach(r=>(r.tenants||[]).forEach(t=>{
      if(t.status==='vacated'||t.status==='deleted') vacateCount++;
      else continueCount++;
    }));
    modal.appendChild(el('div',{className:'info-box'},`✅ ${continueCount} tenants will be rolled over\n❌ ${vacateCount} vacated/deleted will NOT carry over`));
    modal.appendChild(el('button',{className:'btn btn-primary btn-full',onClick:()=>rolloverToMonth(targetKey)},`🔄 Roll over ${continueCount} tenants to ${monthLabel(targetKey)}`));
  }

  modal.appendChild(el('button',{className:'btn btn-gray btn-full',style:{marginTop:'8px'},onClick:()=>{
    // Start fresh for this month
    db.months[targetKey]={rooms:makeEmptyRooms()};
    saveDB(db); showToast(`✅ ${monthLabel(targetKey)} started fresh`); closeModal();
  }},'📋 Start Fresh (empty month)'));

  return modal;
}

    reader.onload=(ev)=>{ _aadharBase64=ev.target.result; pa.innerHTML=''; pa.appendChild(el('img',{src:_aadharBase64,className:'aadhar-preview'})); showToast('✅ Photo ready'); };
    reader.readAsDataURL(file);
  });
  ug.appendChild(fi); ug.appendChild(ub); ug.appendChild(pa); modal.appendChild(ug);

  modal.appendChild(el('div',{style:{height:'8px'}}));
  modal.appendChild(el('button',{className:'btn btn-primary btn-full',onClick:()=>saveTenant(isEdit,tenant)},isEdit?'Update Tenant':'Add Tenant'));
  if(isEdit&&tenant){
    modal.appendChild(el('button',{className:'btn btn-danger btn-full',style:{marginTop:'8px'},onClick:()=>{pendingDelete={type:'tenant',roomNo:currentRoom,id:tenant.id};showModal='confirm_delete';render();}},'🗑 Delete Tenant'));
  }
  return modal;
}

function saveTenant(isEdit,oldTenant){
  const shareNo=parseInt(document.getElementById('tf_shareNo')?.value)||0;
  const name=document.getElementById('tf_name')?.value?.trim();
  const mobile=document.getElementById('tf_mobile')?.value?.trim()||'';
  const aadharNumber=document.getElementById('tf_aadhar')?.value?.trim()||'';
  const dateOfJoining=document.getElementById('tf_dateOfJoining')?.value;
  const totalFee=parseFloat(document.getElementById('tf_totalFee')?.value)||0;
  const paidFee=parseFloat(document.getElementById('tf_paidFee')?.value)||0;
  const paymentDate=document.getElementById('tf_paymentDate')?.value;
  const receivedBy=document.getElementById('tf_receivedBy')?.value||'';
  const payMode=document.getElementById('tf_payMode')?.value||'';
  const status=document.getElementById('tf_status')?.value||'active';
  const comments=document.getElementById('tf_comments')?.value?.trim()||'';

  if(!shareNo){ showToast('⚠️ Select a share number'); return; }
  if(!name||!dateOfJoining||!totalFee){ showToast('⚠️ Fill Name, Date & Monthly Fee'); return; }
  if(paidFee>0&&!receivedBy){ showToast('⚠️ Select who received the payment'); return; }

  const balanceFee=Math.max(0,totalFee-paidFee);
  const room=monthRooms()[currentRoom];

  // Check share conflict
  if(!isEdit||oldTenant?.shareNo!==shareNo){
    const taken=room.tenants.filter(t=>t.id!==(oldTenant?.id||'')).some(t=>t.shareNo===shareNo&&t.status!=='deleted');
    if(taken){ showToast(`⚠️ Share ${shareNo} is already occupied`); return; }
  }

  if(isEdit&&oldTenant){
    const t=room.tenants.find(t=>t.id===oldTenant.id);
    if(t){
      const prevPaid=t.paidFee||0;
      Object.assign(t,{shareNo,name,mobile,aadharNumber,dateOfJoining,totalFee,paidFee,balanceFee,paymentDate,status,comments,lastReceivedBy:receivedBy||t.lastReceivedBy,lastPayMode:payMode||t.lastPayMode});
      if(_aadharBase64) t.aadharCopy=_aadharBase64;
      if(status==='vacated'&&!t.vacatedDate) t.vacatedDate=today();
      if(paidFee>prevPaid&&paymentDate){
        if(!t.paymentHistory) t.paymentHistory=[];
        t.paymentHistory.push({date:paymentDate,amount:paidFee-prevPaid,receivedBy,mode:payMode});
      }
    }
    showToast('✅ Tenant updated');
  } else {
    const sno=(room.tenants||[]).length+1;
    const initPay=paidFee>0?[{date:paymentDate||today(),amount:paidFee,receivedBy,mode:payMode}]:[];
    room.tenants.push({id:uuid(),sno,shareNo,name,mobile,aadharNumber,dateOfJoining,totalFee,paidFee,balanceFee,paymentDate,
      status,comments,lastReceivedBy:receivedBy,lastPayMode:payMode,
      aadharCopy:_aadharBase64||null,paymentHistory:initPay,vacatedDate:status==='vacated'?today():null});
    showToast('✅ Tenant added');
  }
  saveDB(db); _aadharBase64=null; showModal=null; render();
}

    const date=document.getElementById('cp_date')?.value;
    const paidBy=document.getElementById('cp_paidBy')?.value||'';
    const mode=document.getElementById('cp_mode')?.value||'';
    const note=document.getElementById('cp_note')?.value?.trim();
    const entryId=document.getElementById('cp_entry')?.value;
    if(!amount||!date){ showToast('⚠️ Enter amount and date'); return; }
    if(!paidBy){ showToast('⚠️ Select who made the payment'); return; }
    const payment={date,amount,paidBy,mode,note};
    const ents=isGas?db.gasEntries:db.oilEntries;
    if(entryId){ const e=ents.find(e=>e.id===entryId); if(e){ if(!e.payments) e.payments=[]; e.payments.push(payment); } }
    else { for(const e of ents){ const paid=(e.payments||[]).reduce((s,p)=>s+p.amount,0); if(e.totalAmount-paid>0){ if(!e.payments) e.payments=[]; e.payments.push(payment); break; } } }
    saveDB(db); showToast(`✅ ${label} payment · ${paidBy}`); closeModal();
  }},'Save Payment'));
  return modal;
}

function renderUpdatePriceForm(){
  const isGas=commodityType==='gas',icon=isGas?'🔥':'🫙',label=isGas?'Gas Cylinder':'Cooking Oil';
  const current=isGas?db.gasPricePerUnit:db.oilPricePerUnit;
  const modal=el('div',{className:'modal'});
  modal.appendChild(el('div',{className:'modal-title'},`⚙️ Update ${label} Price`,el('button',{className:'icon-btn',style:{fontSize:'20px',color:'var(--text2)'},onClick:closeModal},'✕')));
  modal.appendChild(el('div',{className:'info-box'},`Current: ₹${current.toLocaleString()} per ${isGas?'cylinder':'unit'}`));
  modal.appendChild(el('div',{className:'form-group'},el('label',{},`New Price (₹) *`),el('input',{id:'up_price',type:'number',value:current,className:'req'})));
  modal.appendChild(el('button',{className:'btn btn-primary btn-full',style:{marginTop:'8px'},onClick:()=>{
    const newP=parseFloat(document.getElementById('up_price')?.value)||0;
    if(!newP||newP<100){ showToast('⚠️ Enter valid price'); return; }
    if(isGas) db.gasPricePerUnit=newP; else db.oilPricePerUnit=newP;
    saveDB(db); showToast(`✅ ${label} price → ₹${newP.toLocaleString()}`); closeModal();
  }},'Update Price'));
  return modal;
}

// ════════════════════════════════════════════════════════
//  RENT PAYMENT FORM
// ════════════════════════════════════════════════════════
function renderRentPaymentForm(){
  const rentAmt=db.rentPerMonth||RENT_AMOUNT;
  const paid=getRentPaid(),pending=getRentPending();
  const modal=el('div',{className:'modal'});
  modal.appendChild(el('div',{className:'modal-title',style:{color:'#7b1fa2'}},'🏢 Record Rent Payment',el('button',{className:'icon-btn',style:{fontSize:'20px',color:'var(--text2)'},onClick:closeModal},'✕')));
  modal.appendChild(el('div',{style:{background:'#f3e5f5',borderRadius:'8px',padding:'10px 12px',marginBottom:'14px',fontSize:'12px',color:'#4a148c'}},
    `Monthly Rent: ${formatMoney(rentAmt)}\nPaid so far: ${formatMoney(paid)}\nStill pending: ${formatMoney(pending)}`
  ));
  modal.appendChild(el('div',{className:'form-row'},
    el('div',{className:'form-group'},el('label',{},'Amount (₹) *'),el('input',{id:'rp_amount',type:'number',placeholder:'Enter amount',className:'req',value:pending||''})),
    el('div',{className:'form-group'},el('label',{},'Date *'),el('input',{id:'rp_date',type:'date',value:today()}))
  ));
  modal.appendChild(mkCollectorModeRow('rp_paidBy','rp_mode','',''));
  modal.appendChild(el('div',{className:'form-group'},el('label',{},'Note (optional)'),el('input',{id:'rp_note',type:'text',placeholder:'e.g. Part payment, Full payment...'})));
  modal.appendChild(el('button',{className:'btn btn-full',style:{background:'#7b1fa2',color:'#fff',marginTop:'8px'},onClick:()=>{
    const amount=parseFloat(document.getElementById('rp_amount')?.value)||0;
    const date=document.getElementById('rp_date')?.value;
    const paidBy=document.getElementById('rp_paidBy')?.value||'';
    const mode=document.getElementById('rp_mode')?.value||'';
    const note=document.getElementById('rp_note')?.value?.trim();
    if(!amount||!date){ showToast('⚠️ Enter amount and date'); return; }
    if(!paidBy){ showToast('⚠️ Select who made the payment'); return; }
    const mData=monthData();
    if(!mData.rentPayments) mData.rentPayments=[];
    mData.rentPayments.push({id:uuid(),date,amount,paidBy,mode,note});
    saveDB(db); showToast(`✅ Rent payment ₹${amount.toLocaleString()} · ${paidBy}`); closeModal();
  }},'Save Rent Payment'));
  return modal;
}

function renderUpdateRentForm(){
  const current=db.rentPerMonth||RENT_AMOUNT;
  const modal=el('div',{className:'modal'});
  modal.appendChild(el('div',{className:'modal-title',style:{color:'#7b1fa2'}},'⚙️ Update Monthly Rent',el('button',{className:'icon-btn',style:{fontSize:'20px',color:'var(--text2)'},onClick:closeModal},'✕')));
  modal.appendChild(el('div',{style:{background:'#f3e5f5',borderRadius:'8px',padding:'10px 12px',marginBottom:'14px',fontSize:'12px',color:'#4a148c'}},`Current monthly rent: ${formatMoney(current)}`));
  modal.appendChild(el('div',{className:'form-group'},el('label',{},'New Monthly Rent Amount (₹) *'),el('input',{id:'ur_amount',type:'number',value:current,className:'req'})));
  modal.appendChild(el('button',{className:'btn btn-full',style:{background:'#7b1fa2',color:'#fff',marginTop:'8px'},onClick:()=>{
    const val=parseFloat(document.getElementById('ur_amount')?.value)||0;
    if(!val||val<1000){ showToast('⚠️ Enter valid rent amount'); return; }
    db.rentPerMonth=val; saveDB(db); showToast(`✅ Rent updated to ${formatMoney(val)}`); closeModal();
  }},'Update Rent'));
  return modal;
}

// ════════════════════════════════════════════════════════
//  CONFIRM DELETE
// ════════════════════════════════════════════════════════
function renderConfirmDelete(){
  const isTenant=pendingDelete?.type==='tenant';
  const modal=el('div',{className:'modal'});
  modal.appendChild(el('div',{className:'modal-title',style:{color:'var(--danger)'}},'⚠️ Confirm Delete'));
  if(isTenant){
    modal.appendChild(el('div',{className:'danger-box'},'This tenant will be permanently deleted from this month and will NOT be carried over to future months.'));
  }
  modal.appendChild(el('p',{style:{fontSize:'14px',color:'var(--text2)',marginBottom:'16px'}},isTenant?'Delete this tenant permanently? This cannot be undone.':'Delete this entry?'));
  modal.appendChild(el('div',{style:{display:'flex',gap:'10px'}},
    el('button',{className:'btn btn-outline btn-full',onClick:()=>{ showModal=isTenant?'tenant_detail':null; pendingDelete=null; render(); }},'Cancel'),
    el('button',{className:'btn btn-danger btn-full',onClick:()=>{
      if(!pendingDelete) return;
      if(pendingDelete.type==='expense'){ db.expenses=db.expenses.filter(e=>e.id!==pendingDelete.id); showToast('🗑 Expense deleted'); }
      else if(pendingDelete.type==='water'){ db.waterTankers=db.waterTankers.filter(w=>w.id!==pendingDelete.id); showToast('🗑 Entry deleted'); }
      else if(pendingDelete.type==='rent'){ const md=monthData(); if(md) md.rentPayments=(md.rentPayments||[]).filter(p=>p.id!==pendingDelete.id); showToast('🗑 Rent payment deleted'); }
      else if(pendingDelete.type==='tenant'){
        const room=monthRooms()[pendingDelete.roomNo];
        if(room) room.tenants=room.tenants.filter(t=>t.id!==pendingDelete.id);
        showToast('🗑 Tenant deleted'); currentTenant=null;
      }
      saveDB(db); pendingDelete=null; showModal=null; render();
    }},'Delete')
  ));
  return modal;
}

// Service worker offline caching only works over http(s); skip on file:// to avoid
// iOS Safari SecurityError noise, and guard with try/catch since blob: SW scripts
// are unsupported on some WebKit versions.
if('serviceWorker' in navigator && (location.protocol==='https:'||location.protocol==='http:')){
  try{
    const sw=`const C='srinivasa-v3';self.addEventListener('install',e=>{e.waitUntil(caches.open(C).then(c=>c.addAll(['./',location.pathname])));self.skipWaiting();});self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==C).map(k=>caches.delete(k)))));self.clients.claim();});self.addEventListener('fetch',e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).catch(()=>caches.match(location.pathname))));});`;
    navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw],{type:'text/javascript'}))).catch(()=>{});
  }catch(e){}
}
